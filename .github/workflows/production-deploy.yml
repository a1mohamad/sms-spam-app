name: Production deploy

on:
  # Keep the initial rollout deliberate. Automatic main-branch deployments
  # can be enabled after the Render Blueprint and deploy hook are verified.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    name: Migrate Neon and deploy Render
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate deployment secrets
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DATABASE_URL" || {
            echo "NEON_DIRECT_DATABASE_URL is not configured."
            exit 1
          }
          test -n "$RENDER_DEPLOY_HOOK_URL" || {
            echo "RENDER_API_DEPLOY_HOOK_URL is not configured."
            exit 1
          }

      - name: Apply production database migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic current

      - name: Trigger Render API deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
        run: >-
          curl
          --fail
          --show-error
          --silent
          --request POST
          "$RENDER_DEPLOY_HOOK_URL"
